name: Release Obsidian plugin

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version number (e.g. 1.4.0)"
                required: true

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Bump versions
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  npm version "$VERSION" --no-git-tag-version
                  node -e "
                    const fs = require('fs');
                    const v = process.env.VERSION;

                    const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
                    manifest.version = v;
                    fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, '\t') + '\n');

                    const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
                    versions[v] = manifest.minAppVersion;
                    fs.writeFileSync('versions.json', JSON.stringify(versions, null, '\t') + '\n');
                  "

            - name: Check and build
              run: npm ci && npm run check

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v3
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Commit, tag, and push
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add package.json manifest.json versions.json
                  git commit -m "Release $VERSION"
                  git tag "$VERSION"
                  git push && git push --tags

            - name: Create GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ inputs.version }}
                  name: ${{ inputs.version }}
                  files: |
                      main.js
                      manifest.json
                      styles.css